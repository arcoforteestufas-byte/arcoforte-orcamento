<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espera de arco 3018</title>
<style>
  :root{--g:#0b3930;--o:#f8611a;--m:#5d6664;--bg:#f4f6f5;--line:#dde3e1}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;font-family:Roboto,Arial,sans-serif;color:#1f2826}
  .app{display:grid;grid-template-columns:1fr 360px;height:100vh}
  .view{position:relative;background:linear-gradient(#cfe0ec,#eef2f0)}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  .tag{position:absolute;left:12px;top:12px;background:rgba(11,57,48,.92);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.35}
  .tag b{font-size:15px}
  .mods{display:flex;gap:6px;margin-top:8px}.mods button{background:rgba(255,255,255,.15);color:#fff;padding:6px 10px;font-size:12px;border-radius:7px}.mods button.on{background:var(--o)}
  .hint{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.9);padding:6px 10px;border-radius:8px;font-size:12px;color:var(--m)}
  .tg{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
  .tg label{background:rgba(255,255,255,.95);padding:6px 10px;border-radius:8px;font-size:12.5px;display:flex;gap:6px;align-items:center;cursor:pointer}
  .panel{overflow:auto;border-left:1px solid var(--line);padding:16px 16px 24px}
  h1{font-size:18px;margin:0 0 4px;color:var(--g)}
  .sub{font-size:13px;color:var(--m);margin:0 0 14px}
  .grp{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--o);margin:14px 0 6px;text-transform:uppercase}
  .row{display:grid;grid-template-columns:28px 1fr 74px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eef1f0}
  .badge{width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
  .nm{font-size:13px;line-height:1.25}
  .nm input[type=range]{width:100%;margin-top:4px;accent-color:var(--g)}
  .val{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--m)}
  .val input{width:52px;padding:5px 4px;border:1px solid var(--line);border-radius:6px;font-size:13px;text-align:right}
  .out{margin-top:16px;background:var(--bg);border-radius:10px;padding:12px}
  .out textarea{width:100%;height:118px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px;font-family:inherit;resize:vertical}
  .btns{display:flex;gap:8px;margin-top:8px}
  button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer}
  .pri{background:var(--o);color:#fff;flex:1}
  .sec{background:#fff;color:var(--g);border:1px solid var(--line)}
  @media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}.panel{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <div class="view">
    <canvas id="c"></canvas>
    <div class="tag"><b id="tTit">Espera de arco</b><br><span id="tCod">Código 3018</span> · medidas em cm</div>
    <div class="tg">
      <label><input type="checkbox" id="tPoste" checked> Poste 100 × 50</label>
      <label><input type="checkbox" id="tCalha" checked> Lateral + perfil duplo (molas separadas)</label>
      <label><input type="checkbox" id="tArco" checked> Arco</label>
      <label><input type="checkbox" id="tCotas" checked> Letras das medidas</label>
    </div>
    <div class="hint">Arraste para girar · role ou use dois dedos para aproximar</div>
  </div>
  <div class="panel">
    <h1>Medidas da peça</h1>
    <p class="sub">Cada letra aparece no desenho. Ajuste até ficar igual à peça real, ou só me diga o valor certo de cada letra.</p>
    <div id="campos"></div>
    <div class="out">
      <div class="grp" style="margin-top:0">Resumo para me enviar</div>
      <textarea id="res" readonly></textarea>
      <div class="btns"><button class="pri" id="copiar">Copiar medidas</button><button class="sec" id="padrao">Voltar ao padrão</button></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ---------- Medidas (cm / graus) ----------
  var CAMPOS = [
    {g:"Chapa"},
    {k:"A", n:"Comprimento da parte reta da chapa (presa no poste)", v:15.5, min:8, max:60, s:.5, cor:"#e53935"},
    {k:"B", n:"Largura da chapa", v:3, min:1.5, max:10, s:.1, cor:"#1e6fd9"},
    {k:"E", n:"Espessura da chapa", v:0.4, min:.1, max:.8, s:.05, cor:"#6d4c41"},
    {k:"C", n:"Comprimento da dobra (parte de cima, onde o tubo é soldado)", v:4, min:1, max:15, s:.5, cor:"#8e24aa"},
    {k:"D", n:"Ângulo da dobra (graus em relação à parte reta)", v:35, min:0, max:80, s:1, u:"°", cor:"#00897b"},
    {g:"Furos"},
    {k:"Q", n:"Quantidade de furos", v:3, min:0, max:6, s:1, u:"un", cor:"#455a64"},
    {k:"R", n:"Distância da dobra até o 1º furo (o furo que prende a lateral)", v:1.5, min:.5, max:20, s:.5, cor:"#5d4037"},
    {k:"S", n:"Distância entre os furos", v:6.5, min:1, max:25, s:.5, cor:"#2e7d32"},
    {g:"Montagem (referência)"},
    {k:"T", n:"Altura da lateral (tubo que passa em cima do poste)", v:6, min:2, max:15, s:.5, cor:"#37474f"},
    {k:"W", n:"Quanto o meio da lateral fica abaixo do 1º furo", v:1.5, min:-5, max:5, s:.5, cor:"#6a1b9a"},
    {k:"U", n:"Altura da dobra acima do topo do poste", v:3, min:-5, max:15, s:.5, cor:"#ff8f00"},
    {g:"Tubo da espera"},
    {k:"F", n:"Diâmetro do tubo", v:4.5, min:2, max:7, s:.1, cor:"#f8611a"},
    {k:"G", n:"Comprimento do tubo", v:16, min:5, max:40, s:.5, cor:"#c62828"}
  ];
  var P = {}; CAMPOS.forEach(function(c){ if(c.k) P[c.k]=c.v });
  var PADRAO = JSON.parse(JSON.stringify(P));

  // ---------- Painel ----------
  var box = document.getElementById("campos");
  CAMPOS.forEach(function(c){
    if(!c.k){ var g=document.createElement("div"); g.className="grp"; g.textContent=c.g; box.appendChild(g); return }
    var r=document.createElement("div"); r.className="row";
    r.innerHTML='<span class="badge" style="background:'+c.cor+'">'+c.k+'</span>'+
      '<div class="nm">'+c.n+(c.falta?' <span style="color:#f8611a;font-weight:700">· falta</span>':'')+'<input type="range"'+(c.auto?' disabled':'')+' min="'+c.min+'" max="'+c.max+'" step="'+c.s+'" data-k="'+c.k+'"></div>'+
      '<div class="val"><input type="number"'+(c.auto?' disabled':'')+' min="'+c.min+'" max="'+c.max+'" step="'+c.s+'" data-k="'+c.k+'">'+(c.u||"cm")+'</div>';
    box.appendChild(r);
  });
  function sync(){
    box.querySelectorAll("input[data-k]").forEach(function(i){ if(document.activeElement!==i) i.value=P[i.getAttribute("data-k")] });
    document.getElementById("res").value = "Espera de arco 3018\n" + CAMPOS.filter(function(c){return c.k}).map(function(c){
      return c.k+" = "+String(P[c.k]).replace(".",",")+" "+(c.u||"cm")+"  ("+c.n.split(" (")[0]+")"
    }).join("\n");
  }
  box.addEventListener("input", function(e){
    var k=e.target.getAttribute("data-k"); if(!k) return;
    var v=parseFloat(String(e.target.value).replace(",", ".")); if(isNaN(v)) return;
    P[k]=v; sync(); montar();
  });
  document.getElementById("padrao").onclick=function(){ P=JSON.parse(JSON.stringify(PADRAO)); sync(); montar() };
  document.getElementById("copiar").onclick=function(){
    var t=document.getElementById("res"); t.select();
    try{ navigator.clipboard.writeText(t.value).then(ok, function(){ document.execCommand("copy"); ok() }) }catch(x){ document.execCommand("copy"); ok() }
    function ok(){ var b=document.getElementById("copiar"); b.textContent="Copiado!"; setTimeout(function(){ b.textContent="Copiar medidas" },1500) }
  };

  // ---------- Cena ----------
  var cv=document.getElementById("c");
  var R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  R.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  R.shadowMap.enabled=true;
  var S=new THREE.Scene();
  var CAM=new THREE.PerspectiveCamera(38,1,.5,2000);
  S.add(new THREE.HemisphereLight(0xffffff,0x8a9a92,.75));
  var sol=new THREE.DirectionalLight(0xffffff,.8); sol.position.set(60,90,70); sol.castShadow=true; S.add(sol);
  var sol2=new THREE.DirectionalLight(0xffffff,.35); sol2.position.set(-60,30,-50); S.add(sol2);

  var aco=new THREE.MeshStandardMaterial({color:0xd3d9db,metalness:.3,roughness:.42,side:THREE.DoubleSide});
  var furoM=new THREE.MeshBasicMaterial({color:0x2a2f2e});
  var posteM=new THREE.MeshStandardMaterial({color:0xaeb6b8,metalness:.25,roughness:.55,transparent:true,opacity:.55});
  var calhaM=new THREE.MeshStandardMaterial({color:0xe9eef0,metalness:.3,roughness:.3,transparent:true,opacity:.5,side:THREE.DoubleSide});
  var arcoM=new THREE.MeshStandardMaterial({color:0xb9c2c4,metalness:.3,roughness:.45,transparent:true,opacity:.6,side:THREE.DoubleSide});

  var G=null, gPoste, gCalha, gArco, gCotas;
  function caixa(w,h,d,m){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m) }
  function furo(r){ var f=new THREE.Mesh(new THREE.CircleGeometry(r,20),furoM); return f }
  // furo passante: desenha nas duas faces da chapa (centro c, normal n, espessura e)
  function furoChapa(c,n,e,r){ [1,-1].forEach(function(sd){ var f=furo(r); f.position.copy(c).addScaledVector(n,sd*(e/2+.03)); f.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),n.clone().multiplyScalar(sd)); G.add(f) }) }
  var MODELO="3019";
  function cil(a,b,r,m){
    var d=new THREE.Vector3().subVectors(b,a), L=d.length();
    var c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,28,1,true),m);
    c.position.copy(a).add(b).multiplyScalar(.5);
    c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
    return c;
  }
  function rotulo(txt,cor){
    var c=document.createElement("canvas"); c.width=c.height=96; var x=c.getContext("2d");
    x.fillStyle=cor; x.beginPath(); x.arc(48,48,44,0,7); x.fill();
    x.lineWidth=6; x.strokeStyle="#fff"; x.stroke();
    x.fillStyle="#fff"; x.font="bold 54px Arial"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(txt,48,52);
    var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
    s.scale.set(2.6,2.6,1); s.renderOrder=10; return s;
  }
  function cota(a,b,k,off){
    var cor=CAMPOS.filter(function(c){return c.k===k})[0].cor;
    var m=new THREE.LineBasicMaterial({color:cor,depthTest:false});
    var o=off||new THREE.Vector3();
    var a2=a.clone().add(o), b2=b.clone().add(o);
    var gl=new THREE.BufferGeometry().setFromPoints([a,a2,a2,b2,b2,b]);
    var l=new THREE.LineSegments(gl,m); l.renderOrder=9; gCotas.add(l);
    var s=rotulo(k,cor); s.position.copy(a2).add(b2).multiplyScalar(.5); gCotas.add(s);
  }
  function marca(p,k){ var cor=CAMPOS.filter(function(c){return c.k===k})[0].cor; var s=rotulo(k,cor); s.position.copy(p); gCotas.add(s) }

  function montar(){
    if(G){ S.remove(G); G.traverse(function(o){ o.geometry&&o.geometry.dispose(); if(o.material&&o.material.map){o.material.map.dispose(); o.material.dispose()} }) }
    G=new THREE.Group(); gPoste=new THREE.Group(); gCalha=new THREE.Group(); gArco=new THREE.Group(); gCotas=new THREE.Group();
    var A=P.A,B=P.B,E=P.E,C=P.C,D=P.D*Math.PI/180,F=P.F,GL=P.G,Q=Math.round(P.Q),Rf=P.R,Sf=P.S,T=P.T,Ua=P.U,Wl=P.W;
    var V=function(x,y,z){return new THREE.Vector3(x,y,z)}, r=F/2, zz=V(0,0,1);
    // Chapa: parte reta em pé, presa na face de FORA do poste (o poste fica do lado +x, que é o lado de dentro da estufa).
    // Ela passa acima do topo do poste a altura da lateral (T); a lateral encosta por FORA da chapa e o 1º furo prende a lateral; os outros prendem no poste.
    var reta=caixa(E,A,B,aco); reta.position.set(E/2,A/2,0); reta.castShadow=true; G.add(reta);
    // Dobra no alto, inclinada para dentro da estufa (+x)
    var dir=V(Math.sin(D),Math.cos(D),0), nor=V(Math.cos(D),-Math.sin(D),0);
    var b0=V(E/2,A,0), dob=caixa(E,C,B,aco); dob.position.copy(b0).addScaledVector(dir,C/2); dob.rotation.z=-D; dob.castShadow=true; G.add(dob);
    var cot=new THREE.Mesh(new THREE.CylinderGeometry(E*.9,E*.9,B,10,1),aco); cot.rotation.x=Math.PI/2; cot.position.copy(b0); G.add(cot);
    // Furos na parte reta
    for(var q=0;q<Q;q++){ var yf=A-Rf-q*Sf; if(yf<1) break; furoChapa(V(E/2,yf,0),V(1,0,0),E,.5) }
    // Tubo soldado no lado de dentro da dobra, paralelo a ela, começando na dobra
    var c0=b0.clone().addScaledVector(nor,E/2+r), c1=c0.clone().addScaledVector(dir,GL);
    var tubo=cil(c0,c1,r,aco); tubo.castShadow=true; G.add(tubo);
    [c0,c1].forEach(function(cc){ var bo=new THREE.Mesh(new THREE.RingGeometry(r-.3,r,32),aco); bo.position.copy(cc); bo.quaternion.setFromUnitVectors(zz,dir); G.add(bo) });
    var smat=new THREE.MeshStandardMaterial({color:0xb9c0c2,metalness:.35,roughness:.7});
    [-1,1].forEach(function(sg){ var a=b0.clone().addScaledVector(nor,E/2+.15).add(V(0,0,sg*(Math.min(B/2,r)*.8))); var s2=cil(a,a.clone().addScaledVector(dir,Math.min(C,GL)),.3,smat); G.add(s2) });
    var fimT=c1;

    // Contexto: poste 100 x 50 (chapa presa na face de 50 mm, lado de dentro), perfil lateral e arco
    var posteH=70, topoP=A-Ua; var po=caixa(10,posteH,5,posteM); po.position.set(E+5,topoP-posteH/2,0); gPoste.add(po);
    var lat=caixa(4,T,A*6,new THREE.MeshStandardMaterial({color:0x5a6064,metalness:.3,roughness:.6})); lat.position.set(-2,A-Rf-Wl,0); gCalha.add(lat);
    // Perfil de alumínio duplo de molas separadas: fundo reto com 3 paredes retas (duas de fora e uma no meio),
    // formando dois canais retangulares, cada um com a sua mola. Bordas dobradas para dentro no topo das paredes.
    // Preso na face de fora da lateral com parafuso autobrocante.
    (function(){
      var alu=new THREE.MeshStandardMaterial({color:0xd5dadc,metalness:.35,roughness:.4,emissive:0x3c4446});
      var yc=A-Rf-Wl, x0=-4, Lz=A*6, t=.15, W=4.4, h=1.3, l=.25;
      function bx(v0,v1,u,w){ var m=caixa(v1-v0,w,Lz,alu); m.position.set(x0-(v0+v1)/2,yc+u,0); gCalha.add(m) }
      bx(0,t,0,W);                                   // fundo
      [-W/2+t/2,0,W/2-t/2].forEach(function(u){ bx(0,h,u,t) });          // paredes
      [-(W/2-t-l/2),W/2-t-l/2,-(t/2+l/2),t/2+l/2].forEach(function(u){ bx(h-t,h,u,l) }); // bordas
      var zm=new THREE.MeshStandardMaterial({color:0x2b3032,metalness:.5,roughness:.5});
      [-1,1].forEach(function(sc){ // mola em zigue-zague de cada canal
        var c=yc+sc*W/4, zp=[], n=Math.round(Lz/3);
        for(var k=0;k<=n;k++) zp.push(new THREE.Vector3(x0-.8,c+(k%2?.6:-.6),-Lz/2+k*Lz/n));
        for(var k=0;k<n;k++) gCalha.add(cil(zp[k],zp[k+1],.1,zm));
      });
      var pm=new THREE.MeshStandardMaterial({color:0xb0b6b8,metalness:.6,roughness:.35});
      [-1,1].forEach(function(sz){ // parafusos autobrocantes no fundo do canal
        var zc=sz*Math.min(10,A*.6);
        var ar=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.1,20),pm); ar.rotation.z=Math.PI/2; ar.position.set(x0-t-.05,yc,zc); gCalha.add(ar);
        var cb=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.35,6),pm); cb.rotation.z=Math.PI/2; cb.position.set(x0-t-.28,yc,zc); gCalha.add(cb);
      });
    })(); // a lateral fica do lado de FORA da chapa, centrada no 1º furo (que prende ela)
    var Ra=r+.35, ar=c0.clone().addScaledVector(dir,1), ar2=c1.clone().addScaledVector(dir,70);
    gArco.add(cil(ar,ar2,Ra,arcoM));

    // Letras das medidas
    var o=1.8;
    cota(V(E,0,B/2),V(E,A,B/2),"A",V(o*1.5,0,o));
    cota(V(E,o*0+2,-B/2),V(E,2,B/2),"B",V(o*1.6,-o,0));
    marca(V(E+1.5,A*.15,B/2+1.6),"E");
    cota(b0.clone().add(V(0,0,B/2)),b0.clone().addScaledVector(dir,C).add(V(0,0,B/2)),"C",V(-o*1.5,o*.5,o));
    marca(b0.clone().add(V(-2.6,2.2,0)),"D");
    if(Q>0){ cota(V(0,A,-B/2-.5),V(0,A-Rf,-B/2-.5),"R",V(-o,0,-o)); if(Q>1) cota(V(0,A-Rf,-B/2-.5),V(0,A-Rf-Sf,-B/2-.5),"S",V(-o*2.2,0,-o)); marca(V(-2,A-Rf-Sf*(Q-1)*.5,-B/2-3),"Q") }
    cota(V(-4,A-Rf-Wl-T/2,B/2+1),V(-4,A-Rf-Wl+T/2,B/2+1),"T",V(-o,0,o));
    cota(V(E+10,topoP,-3),V(E+10,A,-3),"U",V(o*1.4,0,0));
    marca(c1.clone().add(V(0,r+1.8,0)),"F");
    cota(c0.clone().addScaledVector(nor,r),c1.clone().addScaledVector(nor,r),"G",nor.clone().multiplyScalar(2.4));

    G.add(gPoste,gCalha,gArco,gCotas);
    vis(); S.add(G); render();
  }
  function vis(){
    if(!G) return;
    gPoste.visible=document.getElementById("tPoste").checked;
    gCalha.visible=document.getElementById("tCalha").checked;
    gArco.visible=document.getElementById("tArco").checked;
    gCotas.visible=document.getElementById("tCotas").checked;
    render();
  }
  ["tPoste","tCalha","tArco","tCotas"].forEach(function(id){ document.getElementById(id).onchange=vis });

  // ---------- Câmera (girar / aproximar) ----------
  var alvo=new THREE.Vector3(4,18,0), rot={a:-.6,b:.2,d:95};
  function cam(){
    var b=Math.max(-1.4,Math.min(1.45,rot.b));
    CAM.position.set(alvo.x+rot.d*Math.cos(b)*Math.sin(rot.a), alvo.y+rot.d*Math.sin(b), alvo.z+rot.d*Math.cos(b)*Math.cos(rot.a));
    CAM.lookAt(alvo);
  }
  function render(){ cam(); R.render(S,CAM) }
  function tam(){ var w=cv.clientWidth||600,h=cv.clientHeight||400; R.setSize(w,h,false); CAM.aspect=w/h; CAM.updateProjectionMatrix(); render() }
  window.addEventListener("resize",tam);
  var pts={}, dist0=0, d0=0;
  cv.addEventListener("pointerdown",function(e){ cv.setPointerCapture(e.pointerId); pts[e.pointerId]={x:e.clientX,y:e.clientY}; var k=Object.keys(pts); if(k.length===2){ var p=pts[k[0]],q=pts[k[1]]; dist0=Math.hypot(p.x-q.x,p.y-q.y); d0=rot.d } });
  cv.addEventListener("pointermove",function(e){
    var p=pts[e.pointerId]; if(!p) return; var k=Object.keys(pts);
    if(k.length===1){ rot.a-=(e.clientX-p.x)*.008; rot.b+=(e.clientY-p.y)*.008 }
    p.x=e.clientX; p.y=e.clientY;
    if(k.length===2){ var a=pts[k[0]],b=pts[k[1]]; var dd=Math.hypot(a.x-b.x,a.y-b.y); if(dist0) rot.d=Math.max(25,Math.min(300,d0*dist0/dd)) }
    render();
  });
  function solta(e){ delete pts[e.pointerId]; dist0=0 }
  cv.addEventListener("pointerup",solta); cv.addEventListener("pointercancel",solta);
  cv.addEventListener("wheel",function(e){ e.preventDefault(); rot.d=Math.max(25,Math.min(300,rot.d*(e.deltaY>0?1.1:.9))); render() },{passive:false});

  window.__peca={grupo:function(){return G},partes:function(){return{poste:gPoste,calha:gCalha,arco:gArco,cotas:gCotas}},render:render,cena:S,camera:CAM,renderer:R};
  sync(); montar(); tam();
})();
</script>
</body>
</html>
